
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - run:
          name: Verify Salesforce project
          command: |
            echo "Checking Salesforce project structure..."
            test -f sfdx-project.json
            test -f manifest/package.xml
            echo "Salesforce project structure verified!"

workflows:
  salesforce-ci:
    jobs:
      - build
