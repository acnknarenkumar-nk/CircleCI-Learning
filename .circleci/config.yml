
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.14

    steps:
      - checkout

      - run:
          name: Check Node.js and npm
          command: |
            node --version
            npm --version

      - run:
          name: Install Salesforce CLI
          command: |
            npm install --global @salesforce/cli

      - run:
          name: Verify Salesforce CLI
          command: |
            sf --version

      - run:
          name: Diagnose Salesforce CLI
          command: |
            node --version
            npm --version
            sf --version
            sf plugins

      - run:
          name: Authenticate with Salesforce
          command: |
            printf '%s' "$SF_JWT_KEY" > /tmp/server.key
            chmod 600 /tmp/server.key

            sf org login jwt \
              --username "$SF_USERNAME" \
              --client-id "$SF_CLIENT_ID" \
              --jwt-key-file /tmp/server.key \
              --instance-url "$SF_LOGIN_URL" \
              --alias circleci-learning-dev

            sf org display --target-org circleci-learning-dev

      - run:
          name: Verify Salesforce project
          command: |
            test -f sfdx-project.json
            test -f manifest/package.xml
            echo "Salesforce project structure verified!"

workflows:
  salesforce-ci:
    jobs:
      - build
